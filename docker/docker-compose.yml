# ============================================
# EyeCare - Bitta Docker Compose
# ============================================
# Ishga tushirish: docker-compose up -d
# To'xtatish: docker-compose down
# ============================================

version: '3.8'

services:
  # ==================== NGINX + FRONTEND ====================
  nginx:
    image: nginx:alpine
    container_name: eyecare-web
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      # Nginx config
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Frontend build (npm run build qilingan)
      - ../frontend/dist:/var/www/html:ro
      # Backend uploads
      - ../backend/uploads:/var/www/uploads:ro
      # SSL (optional)
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - eyecare-net

  # ==================== BACKEND API ====================
  api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      target: production
    container_name: eyecare-api
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://eyecare:eyecare123@db:5432/eyecare
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBAPP_URL=${TELEGRAM_WEBAPP_URL:-https://eyecare.uz}
    volumes:
      - ../backend/uploads:/app/uploads
      - ../backend/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eyecare-net

  # ==================== POSTGRESQL ====================
  db:
    image: postgres:15-alpine
    container_name: eyecare-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=eyecare
      - POSTGRES_PASSWORD=eyecare123
      - POSTGRES_DB=eyecare
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - eyecare-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U eyecare" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: eyecare-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - eyecare-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  eyecare-net:
    driver: bridge

volumes:
  db_data:
  redis_data:
