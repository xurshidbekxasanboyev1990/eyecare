# ============================================================
# EyeCare - PRODUCTION Docker Compose
# ============================================================
# Ishlatish:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Birinchi marta:
#   1. .env.production faylini to'ldiring
#   2. frontend/dist mavjud bo'lishi kerak (npm run build)
#   3. docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Konteynerlar ishga tushganda:
#   - db va redis avval health check bo'ladi
#   - api entrypoint.sh orqali: DB kutadi -> migration -> uvicorn
#   - nginx api healthy bo'lganda ishga tushadi
# ============================================================

services:

  # ==================== NGINX + FRONTEND ====================
  nginx:
    image: nginx:alpine
    container_name: eyecare-web
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/conf.d/proxy_params.conf:ro
      - ../frontend/dist:/var/www/html:ro
      - uploads_data:/var/www/uploads:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - eyecare-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==================== BACKEND API ====================
  api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      target: production
    image: eyecare-api:${APP_VERSION:-latest}
    container_name: eyecare-api
    restart: always
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}\n      - TELEGRAM_WEBAPP_URL=${APP_URL:-https://eyecare.uz}\n      - CORS_ORIGINS=["${APP_URL:-https://eyecare.uz}","https://www.${DOMAIN:-eyecare.uz}"]
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@eyecare.uz}
      - SMS_PROVIDER=${SMS_PROVIDER:-eskiz}
      - SMS_API_EMAIL=${SMS_API_EMAIL:-}
      - SMS_API_PASSWORD=${SMS_API_PASSWORD:-}
      - WORKERS=${WORKERS:-4}
    volumes:
      - uploads_data:/app/uploads
      - api_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eyecare-net
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  # ==================== POSTGRESQL ====================
  db:
    image: postgres:15-alpine
    container_name: eyecare-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_backups:/backups
    networks:
      - eyecare-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: eyecare-redis
    restart: always
    command: >
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
    volumes:
      - redis_data:/data
    networks:
      - eyecare-net
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ==================== CERTBOT (Let's Encrypt - auto renew) ====================
  certbot:
    image: certbot/certbot:latest
    container_name: eyecare-certbot
    restart: unless-stopped
    volumes:
      - ./ssl:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - eyecare-net

  # ==================== DB BACKUP (daily) ====================
  db-backup:
    image: postgres:15-alpine
    container_name: eyecare-backup
    restart: unless-stopped
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_backups:/backups
    command: >
      sh -c "while true;
        do sleep 86400;
        pg_dump -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -Fc
          -f /backups/backup_$$(date +%Y%m%d_%H%M%S).dump;
        find /backups -name '*.dump' -mtime +7 -delete;
        echo Backup done;
      done"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eyecare-net

networks:
  eyecare-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  db_backups:
    driver: local
  api_logs:
    driver: local
  uploads_data:
    driver: local
  certbot_webroot:
    driver: local
