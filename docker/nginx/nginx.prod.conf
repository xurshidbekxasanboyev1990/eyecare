# ============================================================
# EyeCare - Nginx PRODUCTION Configuration
# HTTPS + Security Headers + Rate Limiting + Gzip
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ========== LOGGING ==========
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ========== PERFORMANCE ==========
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75;
    types_hash_max_size 2048;
    server_tokens      off;  # Hide nginx version

    # ========== GZIP ==========
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/ttf font/opentype font/x-woff;

    # ========== RATE LIMITING ==========
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ========== BACKEND UPSTREAM ==========
    upstream backend {
        server api:8000;
        keepalive 32;
    }

    # ========== HTTP → HTTPS REDIRECT ==========
    server {
        listen 80;
        server_name eyecare.uz www.eyecare.uz;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========== HTTPS SERVER ==========
    server {
        listen 443 ssl http2;
        server_name eyecare.uz www.eyecare.uz;

        # ===== SSL =====
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # HSTS (2 yil)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ===== SECURITY HEADERS =====
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.telegram.org wss:; frame-ancestors 'self';" always;

        root /var/www/html;
        index index.html;

        client_max_body_size 20M;
        limit_conn conn_limit 20;

        # ===== FRONTEND (Vue.js SPA) =====
        location / {
            limit_req zone=general burst=20 nodelay;
            try_files $uri $uri/ /index.html;

            # Cache static build assets
            location ~* \.(js|css|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }

            location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
                expires 30d;
                add_header Cache-Control "public";
                access_log off;
            }
        }

        # ===== AUTH (Strict rate limit) =====
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ===== BACKEND API =====
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ===== TELEGRAM WEBHOOK =====
        location /webhook/telegram {
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ===== API DOCS (Production da yopiq) =====
        location ~ ^/(docs|redoc|openapi.json) {
            # Faqat admin IP dan ruxsat (o'zgartiring)
            # allow 1.2.3.4;
            # deny all;
            return 404;
        }

        # ===== UPLOADS =====
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff";

            # Faqat rasm va hujjatlar
            location ~* \.(php|py|sh|exe|bat)$ {
                deny all;
            }
        }

        # ===== HEALTH CHECK =====
        location /health {
            access_log off;
            proxy_pass http://backend/health;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ===== NGINX STATUS (monitoring) =====
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker network
            deny all;
        }

        # ===== BLOCK BOTS / SCANNERS =====
        location ~* \.(env|git|svn|htaccess|htpasswd|bak|sql|log)$ {
            deny all;
        }

        location ~ /\. {
            deny all;
            access_log off;
        }
    }
}
